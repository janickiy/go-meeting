# Изолированный стенд: -p recorder-stage8 -f docker-compose.integration.yml -f docker-compose.product-test.yml -f docker-compose.intelligence-test.yml
# Никаких внешних платных провайдеров: mock генерирует только явно тестовые результаты.
x-live: &live
  LIVE_STT_ENABLED: "true"
  LIVE_STT_PROVIDER_MODE: mock
  MEETING_ANALYTICS_ENABLED: "true"
  EMBEDDINGS_ENABLED: "true"
  EMBEDDING_PROVIDER_MODE: mock
  EMBEDDING_MODEL: stage8-test-fixture
  EMBEDDING_VERSION: v1

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg16
  api:
    environment:
      <<: *live
  product-worker:
    environment:
      <<: *live
  live-worker:
    build: {context: ., dockerfile: dockers/live-worker/Dockerfile, target: runtime}
    init: true
    environment:
      <<: *live
      APP_ENV: test
      GIN_MODE: release
      JWT_SECRET: stage6-test-only-jwt-000000000000000000
      MEDIA_TICKET_SECRET: stage6-test-only-ticket-00000000000000
      MEDIA_INTERNAL_SECRET: stage6-test-only-media-000000000000000
      WORKER_INTERNAL_SECRET: stage6-test-only-worker-00000000000000
      METRICS_SECRET: stage6-test-only-metrics-0000000000000
      POSTGRES_HOST: postgres
      POSTGRES_DB: recorder_stage6
      POSTGRES_USER: recorder_stage6
      POSTGRES_PASSWORD: stage6-test-only-password
      REDIS_HOST: redis
      MEDIA_WORKER_INTERNAL_URL: http://media-worker:8091
    ports: ["127.0.0.1:18093:8093"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      media-worker: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8093/health/ready"]
      interval: 2s
      timeout: 2s
      retries: 30
    stop_grace_period: 30s
    cpus: 2.0
    mem_limit: 768m
    pids_limit: 128
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
