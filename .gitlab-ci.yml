stages:
  - test
  - build
  - deploy

variables:
  GO_VERSION: "1.26.6"
  GO_ALPINE_VERSION: "3.23"
  GIT_STRATEGY: "none"
  GIT_DEPTH: "1"
  GIT_SUBMODULE_STRATEGY: "none"
  GIT_FETCH_EXTRA_FLAGS: "--no-tags"
  GOMODCACHE: "$CI_PROJECT_DIR/.go/pkg/mod"
  GOCACHE: "$CI_PROJECT_DIR/.go/cache"
  DEPLOY_PORT: "22"

default:
  interruptible: true
  tags:
    - recorder

workflow:
  rules:
    - if: "$CI_COMMIT_BRANCH"

.go-job:
  image: "golang:${GO_VERSION}-alpine${GO_ALPINE_VERSION}"
  before_script:
    - apk add --no-cache curl git tar build-base
    - SOURCE_WORK_DIR="$(mktemp -d)"
    - cd "$SOURCE_WORK_DIR"
    - SOURCE_ARCHIVE_TOKEN="$(printf "%s" "${CI_SOURCE_ARCHIVE_TOKEN_B64}" | base64 -d)"
    - 'curl --fail --location --http1.1 --ipv4 --connect-timeout 10 --max-time 120 --speed-limit 1024 --speed-time 30 --retry 2 --retry-all-errors --silent --show-error --header "PRIVATE-TOKEN: ${SOURCE_ARCHIVE_TOKEN}" "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/repository/archive.tar.gz?sha=${CI_COMMIT_SHA}" --output source.tar.gz'
    - tar -xzf source.tar.gz --strip-components=1
    - rm source.tar.gz
    - unset SOURCE_ARCHIVE_TOKEN
    - unset ALL_PROXY HTTPS_PROXY HTTP_PROXY all_proxy https_proxy http_proxy
    - export PATH="/usr/local/go/bin:$PATH"
    - 'if command -v go >/dev/null 2>&1; then go version; fi'
  cache:
    key: "${CI_PROJECT_NAME}-go-${CI_COMMIT_REF_SLUG}"
    paths:
      - .go/pkg/mod
      - .go/cache

go-test:
  extends: .go-job
  stage: test
  timeout: 30m
  script:
    - test -z "$(gofmt -l $(find cmd internal tests tools -name '*.go'))"
    - go vet ./...
    - go test ./...
    - go test -race ./...
    - go run golang.org/x/vuln/cmd/govulncheck@v1.8.0 ./...

go-build:
  extends: .go-job
  stage: build
  timeout: 30m
  needs:
    - go-test
  script:
    - mkdir -p .build
    - go build -o .build/api ./cmd/api
    - go build -o .build/worker ./cmd/worker
    - go build -o .build/media-worker ./cmd/media-worker
    - go build -o .build/main ./cmd/main

frontend-check:
  extends: .go-job
  image: node:24-alpine
  stage: test
  timeout: 10m
  script:
    - cd frontend
    - npm ci
    - npm run typecheck
    - npm test
    - npm run build
    - npm audit --omit=dev

media-soak-manual:
  extends: .go-job
  stage: test
  timeout: 40m
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
    - when: manual
  script:
    - RECORDER_MEDIA_LOAD=true go test -v ./internal/infrastructure/sfu -run '^TestStageSixMediaLoad$' -timeout 5m
    - RECORDER_SOAK_DURATION=30m go test -v ./internal/infrastructure/sfu -run '^TestStageSixSoak$' -timeout 35m

deploy-dev:
  image: alpine:3.22
  stage: deploy
  timeout: 30m
  needs:
    - go-build
  before_script:
    - apk add --no-cache bash curl git openssh-client rsync sshpass tar
    - 'find . -mindepth 1 -maxdepth 1 ! -name .go -exec rm -rf {} +'
    - SOURCE_ARCHIVE_TOKEN="$(printf "%s" "${CI_SOURCE_ARCHIVE_TOKEN_B64}" | base64 -d)"
    - 'curl --fail --location --http1.1 --ipv4 --connect-timeout 10 --max-time 120 --speed-limit 1024 --speed-time 30 --retry 2 --retry-all-errors --silent --show-error --header "PRIVATE-TOKEN: ${SOURCE_ARCHIVE_TOKEN}" "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/repository/archive.tar.gz?sha=${CI_COMMIT_SHA}" --output source.tar.gz'
    - tar -xzf source.tar.gz --strip-components=1
    - rm source.tar.gz
    - unset SOURCE_ARCHIVE_TOKEN
    - unset ALL_PROXY HTTPS_PROXY HTTP_PROXY all_proxy https_proxy http_proxy
  script:
    - bash scripts/ci-deploy.sh
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
      when: on_success
