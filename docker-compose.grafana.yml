# Необязательная Grafana. Классический release layout сохраняет прежнее поведение.
# Hardened shared-host не включает этот файл из-за CVE во встроенных плагинах.
services:
  grafana:
    image: ${GRAFANA_IMAGE:?set immutable GRAFANA_IMAGE}
    profiles: [observability]
    environment: {GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_password, GF_USERS_ALLOW_SIGN_UP: "false", GF_AUTH_ANONYMOUS_ENABLED: "false"}
    ports: ["127.0.0.1:13001:3000"]
    volumes: ["${GRAFANA_PASSWORD_FILE:-./secrets/grafana_password}:/run/secrets/grafana_password:ro", "./dockers/observability/provisioning:/etc/grafana/provisioning:ro", "./dockers/observability/dashboard.json:/var/lib/grafana/dashboards/release.json:ro", "grafana:/var/lib/grafana"]
    networks: [private]
