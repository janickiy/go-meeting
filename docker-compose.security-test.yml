# Отдельные данные и loopback-порты для регрессии новых инфраструктурных образов.
services:
  postgres:
    image: meetrix-hardened/postgres:20261003.2
    env_file: ${SECURITY_ENV_FILE:?set isolated configuration file}
    ports: ["127.0.0.1:25434:5432"]
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 2s
      retries: 20
  redis:
    image: meetrix-hardened/redis:20261003.1
    env_file: ${SECURITY_ENV_FILE}
    command: [/bin/sh, -c, 'exec redis-server --requirepass "$${REDIS_PASSWORD}" --save "" --appendonly no']
    ports: ["127.0.0.1:26381:6379"]
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping | grep -q PONG']
      interval: 3s
      timeout: 2s
      retries: 20
  rabbitmq:
    image: rabbitmq:4.2.9-management
    env_file: ${SECURITY_ENV_FILE}
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_MQ_USER:?set isolated broker user}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_MQ_PASSWORD:?set isolated broker password}
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "+S 2:2"
    ports: ["127.0.0.1:25683:5672"]
    volumes: ["rabbitmq:/var/lib/rabbitmq"]
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 3s
      timeout: 3s
      retries: 30
  object-storage:
    image: meetrix-hardened/object-storage:20261003.2
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?set isolated S3 access key}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?set isolated S3 secret key}
      S3_BUCKET: recordings
    volumes: ["objects:/data"]
    ports: ["127.0.0.1:29100:9000"]
    read_only: true
    tmpfs: ["/tmp:size=32m,mode=1777"]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      test: [CMD-SHELL, 'wget -q -S -O /dev/null http://127.0.0.1:9000/ 2>&1 | grep -q "403 Forbidden"']
      interval: 3s
      timeout: 2s
      retries: 30
      start_period: 30s
volumes:
  postgres:
  rabbitmq:
  objects:
