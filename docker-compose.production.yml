# Перед запуском заполнить .env.production и смонтировать действительные сертификаты.
x-process: &process
  env_file: .env.production
  restart: unless-stopped
  stop_grace_period: 45s
  init: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
  pids_limit: 512
  networks: [private]
services:
  api:
    <<: *process
    build: {context: ., dockerfile: dockers/api/Dockerfile, target: runtime, args: {BUILD_VERSION: "${BUILD_VERSION:?set immutable release version or commit}"}}
    environment: {APP_ENV: production, GIN_MODE: release, APP_PORT: "8085"}
    mem_limit: 512m
    cpus: 2
    read_only: true
    healthcheck:
      test: [CMD, wget, -q, --spider, "http://127.0.0.1:8085/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 30s
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      minio: {condition: service_healthy}
      media-worker: {condition: service_healthy}
  media-worker:
    <<: *process
    build: {context: ., dockerfile: dockers/media-worker/Dockerfile, target: runtime}
    environment: {APP_ENV: production, GIN_MODE: release, MEDIA_HTTP_PORT: "8091"}
    mem_limit: 2g
    cpus: 4
    read_only: true
    ports: ["${MEDIA_UDP_PORT:-50010}:${MEDIA_UDP_PORT:-50010}/udp", "${MEDIA_TCP_PORT:-50010}:${MEDIA_TCP_PORT:-50010}/tcp"]
    healthcheck:
      test: [CMD, wget, -q, --spider, "http://127.0.0.1:8091/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 6
    depends_on:
      redis: {condition: service_healthy}
  worker:
    <<: *process
    build: {context: ., dockerfile: dockers/worker/Dockerfile, target: runtime}
    # Каталог тома должен заранее принадлежать UID app; root entrypoint не нужен.
    user: "1000:1000"
    entrypoint: /app/go-recorder-worker
    environment: {APP_ENV: production, GIN_MODE: release, WORKER_PORT: "8090", STORAGE_PATH: /storage, WEBRTC_UDP_PORT: "0", WEBRTC_TCP_PORT: "0"}
    mem_limit: 4g
    cpus: 4
    pids_limit: 128
    volumes: ["${RECORDER_STORAGE_DIR:?set recorder storage directory}:/storage"]
    healthcheck:
      test: [CMD, wget, -q, --spider, "http://127.0.0.1:8090/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 6
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      minio: {condition: service_healthy}
  product-worker:
    <<: *process
    build: {context: ., dockerfile: dockers/product-worker/Dockerfile, target: runtime}
    environment: {APP_ENV: production, GIN_MODE: release, PRODUCT_WORKER_PORT: "8092"}
    mem_limit: 2g
    cpus: 2
    pids_limit: 96
    read_only: true
    # Под стандартный один STT job: max video 1GiB + max audio 256MiB.
    tmpfs: ["/tmp:size=1536m,mode=1777"]
    healthcheck:
      test: [CMD, wget, -q, --spider, "http://127.0.0.1:8092/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 6
      start_period: 30s
    depends_on:
      postgres: {condition: service_healthy}
      minio: {condition: service_healthy}
  live-worker:
    <<: *process
    build: {context: ., dockerfile: dockers/live-worker/Dockerfile, target: runtime}
    environment: {APP_ENV: production, GIN_MODE: release, LIVE_WORKER_PORT: "8093"}
    mem_limit: 768m
    cpus: 2
    pids_limit: 128
    read_only: true
    tmpfs: ["/tmp:size=16m,mode=1777"]
    healthcheck:
      test: [CMD, wget, -q, --spider, "http://127.0.0.1:8093/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 6
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      media-worker: {condition: service_healthy}
  frontend:
    build: {context: ./frontend, dockerfile: Dockerfile}
    restart: unless-stopped
    environment: {API_UPSTREAM: "api:8085", APP_ENV: production, PUBLIC_FRONTEND_URL: "${PUBLIC_FRONTEND_URL:?set frontend HTTPS origin}", MINIO_PUBLIC_ENDPOINT: "${MINIO_PUBLIC_ENDPOINT:?set public storage HTTPS origin}"}
    networks: [private]
    mem_limit: 256m
  proxy:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["443:443"]
    volumes: ["./dockers/production/nginx.conf:/etc/nginx/conf.d/default.conf:ro", "${TLS_CERT_DIR:?set TLS certificate directory}:/run/certs:ro"]
    networks: [private]
    depends_on: [api, frontend]
  coturn:
    image: coturn/coturn:4.18.0-r0
    env_file: .env.production
    entrypoint: [/bin/sh, /opt/turn-entrypoint.sh]
    restart: unless-stopped
    volumes: ["./dockers/turn/entrypoint.sh:/opt/turn-entrypoint.sh:ro", "./dockers/turn/turnserver.conf:/etc/coturn/turnserver.conf:ro", "${TURN_TLS_CERT_DIR:?set TURN TLS certificate directory}:/run/certs:ro"]
    ports: ["3478:3478/udp", "3478:3478/tcp", "5349:5349/tcp", "${TURN_MIN_PORT:-49160}-${TURN_MAX_PORT:-49259}:${TURN_MIN_PORT:-49160}-${TURN_MAX_PORT:-49259}/udp"]
    networks: [private]
    mem_limit: 512m
  postgres:
    image: postgres:16-alpine
    env_file: .env.production
    command: [postgres, -c, "max_connections=100"]
    restart: unless-stopped
    volumes: ["postgres:/var/lib/postgresql/data"]
    networks: [private]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 12
  redis:
    image: redis:7-alpine
    env_file: .env.production
    command: [/bin/sh, -c, 'exec redis-server --requirepass "$${REDIS_PASSWORD}" --save "" --appendonly no --maxmemory 256mb --maxmemory-policy noeviction']
    restart: unless-stopped
    networks: [private]
    healthcheck:
      test: [CMD-SHELL, 'REDISCLI_AUTH="$${REDIS_PASSWORD}" redis-cli ping | grep -q PONG']
      interval: 5s
      timeout: 3s
      retries: 12
  rabbitmq:
    image: rabbitmq:4.2.9-management
    environment: {RABBITMQ_DEFAULT_USER: "${RABBIT_MQ_USER:?set broker user}", RABBITMQ_DEFAULT_PASS: "${RABBIT_MQ_PASSWORD:?set broker password}"}
    restart: unless-stopped
    volumes: ["rabbitmq:/var/lib/rabbitmq"]
    networks: [private]
    healthcheck:
      test: [CMD, rabbitmq-diagnostics, -q, ping]
      interval: 5s
      timeout: 3s
      retries: 12
  minio:
    build: {context: ., dockerfile: dockers/minio/Dockerfile}
    env_file: .env.production
    command: [server, /data, --console-address, ":9001"]
    restart: unless-stopped
    volumes: ["minio:/data"]
    networks: [private]
    healthcheck:
      test: [CMD, wget, -q, --spider, "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 12
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [observability]
    command: [--config.file=/etc/prometheus/prometheus.yml, --storage.tsdb.retention.time=7d]
    ports: ["127.0.0.1:19090:9090"]
    volumes: ["./dockers/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro", "./dockers/observability/alerts.yml:/etc/prometheus/alerts.yml:ro", "${METRICS_TOKEN_FILE:-./secrets/metrics_token}:/run/secrets/metrics_token:ro", "prometheus:/prometheus"]
    networks: [private]
  grafana:
    image: grafana/grafana:12.2.0
    profiles: [observability]
    environment: {GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_password, GF_USERS_ALLOW_SIGN_UP: "false", GF_AUTH_ANONYMOUS_ENABLED: "false"}
    ports: ["127.0.0.1:13001:3000"]
    volumes: ["${GRAFANA_PASSWORD_FILE:-./secrets/grafana_password}:/run/secrets/grafana_password:ro", "./dockers/observability/provisioning:/etc/grafana/provisioning:ro", "./dockers/observability/dashboard.json:/var/lib/grafana/dashboards/stage6.json:ro", "grafana:/var/lib/grafana"]
    networks: [private]
networks:
  private:
volumes:
  postgres:
  rabbitmq:
  minio:
  prometheus:
  grafana:
