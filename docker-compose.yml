services:
  api:
    image: go-recorder_api
    restart: unless-stopped
    build:
      context: .
      dockerfile: dockers/api/Dockerfile
      target: runtime
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "${APP_HOST_PORT:-8085}:${APP_PORT:-8085}"
    networks:
      app-network:
      rabbit_mq_network:
      gateway_network:
        aliases:
          - record-api

  https:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${HTTPS_HOST_PORT:-18482}:443"
    volumes:
      - ./dockers/https/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./dockers/https/certs:/etc/nginx/certs:ro
    networks:
      - app-network

  api-debug:
    profiles:
      - debug
    build:
      context: .
      dockerfile: dockers/api/Dockerfile
      target: debug
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "${APP_HOST_PORT:-8085}:${APP_PORT:-8085}"
      - "${DLV_API_PORT:-2345}:2345"
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    networks:
      app-network:
        aliases:
          - api
      rabbit_mq_network:

  worker:
    image: go-recorder-worker
    restart: unless-stopped
    build:
      context: .
      dockerfile: dockers/worker/Dockerfile
      target: runtime
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "${WORKER_HOST_PORT:-8090}:8090"
      - "${WEBRTC_UDP_PORT:-50000}:${WEBRTC_UDP_PORT:-50000}/udp"
      - "${WEBRTC_TCP_PORT:-${WEBRTC_UDP_PORT:-50000}}:${WEBRTC_TCP_PORT:-${WEBRTC_UDP_PORT:-50000}}/tcp"
    volumes:
      - ./dockers/storage/data:/storage
    networks:
      app-network:
      rabbit_mq_network:
      gateway_network:
        aliases:
          - record-worker

  worker-debug:
    profiles:
      - debug
    build:
      context: .
      dockerfile: dockers/worker/Dockerfile
      target: debug
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      minio:
        condition: service_healthy
    ports:
      - "${WORKER_HOST_PORT:-8090}:8090"
      - "${DLV_WORKER_PORT:-2346}:2346"
      - "${WEBRTC_UDP_PORT:-50000}:${WEBRTC_UDP_PORT:-50000}/udp"
      - "${WEBRTC_TCP_PORT:-${WEBRTC_UDP_PORT:-50000}}:${WEBRTC_TCP_PORT:-${WEBRTC_UDP_PORT:-50000}}/tcp"
    volumes:
      - ./dockers/storage/data:/storage
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    networks:
      app-network:
        aliases:
          - worker
      rabbit_mq_network:

  postgres:
    restart: unless-stopped
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-go_recorder}
      POSTGRES_USER: ${POSTGRES_USER:-go_recorder}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-go_recorder_pass}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - ./dockers/postgres/data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-go_recorder} -d ${POSTGRES_DB:-go_recorder}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - app-network

  redis:
    restart: unless-stopped
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - ./dockers/redis/data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - app-network

  minio:
    restart: unless-stopped
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-go_recorder}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-go_recorder_pass}
    ports:
      - "${MINIO_PORT_HOST:-9000}:9000"
      - "${MINIO_CONSOLE_PORT_HOST:-9001}:9001"
    volumes:
      - ./dockers/minio/data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
  rabbit_mq_network:
    external: true
    name: ${RABBIT_MQ_NETWORK:-infra_network}
  gateway_network:
    external: true
    name: ${GATEWAY_NETWORK:-gateway_default}
