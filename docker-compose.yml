# Keep all Compose clients on the project's broker, even with an old .env.
x-rabbitmq-client: &rabbitmq-client
  RABBIT_MQ_DSN: ""
  RABBIT_MQ_HOST: rabbitmq
  RABBIT_MQ_PORT: "5672"
  RABBIT_MQ_USER: ${RABBIT_MQ_USER:-go_recorder}
  RABBIT_MQ_PASSWORD: ${RABBIT_MQ_PASSWORD:-go_recorder_pass}
  RABBIT_MQ_VHOST: ${RABBIT_MQ_VHOST:-/}

services:
  api:
    image: go-recorder_api
    restart: unless-stopped
    build:
      context: .
      dockerfile: dockers/api/Dockerfile
      target: runtime
    env_file:
      - .env
    environment:
      <<: *rabbitmq-client
      MEDIA_WORKER_INTERNAL_URL: "http://media-worker:8091"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      media-worker:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "${APP_HOST_PORT:-8085}:${APP_PORT:-8085}"
    networks:
      app-network:
      gateway_network:
        aliases:
          - record-api

  product-worker:
    image: go-recorder-product-worker:local
    restart: unless-stopped
    init: true
    build: {context: ., dockerfile: dockers/product-worker/Dockerfile, target: runtime}
    env_file: [.env]
    environment:
      PRODUCT_WORKER_PORT: "8092"
    depends_on:
      postgres: {condition: service_healthy}
      minio: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8092/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 6
    stop_grace_period: 45s
    networks: [app-network]

  frontend:
    image: go-recorder-frontend:local
    restart: unless-stopped
    build:
      context: ./frontend
      dockerfile: Dockerfile
    environment:
      API_UPSTREAM: "api:${APP_PORT:-8085}"
    depends_on:
      - api
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-5173}:8080"
    networks:
      - app-network

  https:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      - api
      - frontend
    ports:
      - "${HTTPS_HOST_PORT:-18482}:443"
    volumes:
      - ./dockers/https/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./dockers/https/certs:/etc/nginx/certs:ro
    networks:
      - app-network

  api-debug:
    profiles:
      - debug
    build:
      context: .
      dockerfile: dockers/api/Dockerfile
      target: debug
    env_file:
      - .env
    environment:
      <<: *rabbitmq-client
      MEDIA_WORKER_INTERNAL_URL: "http://media-worker:8091"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      media-worker:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "${APP_HOST_PORT:-8085}:${APP_PORT:-8085}"
      - "${DLV_API_PORT:-2345}:2345"
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    networks:
      app-network:
        aliases:
          - api

  media-worker:
    image: go-recorder-media-worker:local
    restart: unless-stopped
    build:
      context: .
      dockerfile: dockers/media-worker/Dockerfile
      target: runtime
    env_file:
      - .env
    environment:
      MEDIA_HTTP_PORT: "8091"
      MEDIA_WORKER_INTERNAL_URL: "http://media-worker:8091"
      # Dedicated SFU sockets, independent from recorder-worker's port 50000.
      MEDIA_UDP_PORT: "${MEDIA_UDP_PORT:-50010}"
      MEDIA_TCP_PORT: "${MEDIA_TCP_PORT:-50010}"
      MEDIA_UDP_MIN_PORT: "0"
      MEDIA_UDP_MAX_PORT: "0"
      MEDIA_NAT_IPS: "${MEDIA_NAT_IPS:-127.0.0.1}"
    depends_on:
      redis:
        condition: service_healthy
    # Internal HTTP is not published to the host or gateway network.
    expose:
      - "8091"
    ports:
      - "${MEDIA_UDP_PORT:-50010}:${MEDIA_UDP_PORT:-50010}/udp"
      - "${MEDIA_TCP_PORT:-50010}:${MEDIA_TCP_PORT:-50010}/tcp"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8091/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - app-network

  worker:
    image: go-recorder-worker
    restart: unless-stopped
    build:
      context: .
      dockerfile: dockers/worker/Dockerfile
      target: runtime
    env_file:
      - .env
    environment: *rabbitmq-client
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "${WORKER_HOST_PORT:-8090}:8090"
      - "${WEBRTC_UDP_PORT:-50000}:${WEBRTC_UDP_PORT:-50000}/udp"
      - "${WEBRTC_TCP_PORT:-${WEBRTC_UDP_PORT:-50000}}:${WEBRTC_TCP_PORT:-${WEBRTC_UDP_PORT:-50000}}/tcp"
    volumes:
      - ./dockers/storage/data:/storage
    networks:
      app-network:
      gateway_network:
        aliases:
          - record-worker

  worker-debug:
    profiles:
      - debug
    build:
      context: .
      dockerfile: dockers/worker/Dockerfile
      target: debug
    env_file:
      - .env
    environment: *rabbitmq-client
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    ports:
      - "${WORKER_HOST_PORT:-8090}:8090"
      - "${DLV_WORKER_PORT:-2346}:2346"
      - "${WEBRTC_UDP_PORT:-50000}:${WEBRTC_UDP_PORT:-50000}/udp"
      - "${WEBRTC_TCP_PORT:-${WEBRTC_UDP_PORT:-50000}}:${WEBRTC_TCP_PORT:-${WEBRTC_UDP_PORT:-50000}}/tcp"
    volumes:
      - ./dockers/storage/data:/storage
    cap_add:
      - SYS_PTRACE
    security_opt:
      - seccomp:unconfined
    networks:
      app-network:
        aliases:
          - worker

  rabbitmq:
    image: rabbitmq:4.2.9-management
    hostname: rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBIT_MQ_USER:-go_recorder}
      RABBITMQ_DEFAULT_PASS: ${RABBIT_MQ_PASSWORD:-go_recorder_pass}
      RABBITMQ_DEFAULT_VHOST: ${RABBIT_MQ_VHOST:-/}
    ports:
      - "127.0.0.1:${RABBIT_MQ_HOST_PORT:-5672}:5672"
      - "127.0.0.1:${RABBIT_MQ_MANAGEMENT_HOST_PORT:-15672}:15672"
    volumes:
      - ./dockers/rabbitmq/data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s
    networks:
      - app-network

  postgres:
    restart: unless-stopped
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-go_recorder}
      POSTGRES_USER: ${POSTGRES_USER:-go_recorder}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-go_recorder_pass}
    ports:
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - ./dockers/postgres/data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-go_recorder} -d ${POSTGRES_DB:-go_recorder}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - app-network

  redis:
    restart: unless-stopped
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_HOST_PORT:-6380}:6379"
    volumes:
      - ./dockers/redis/data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - app-network

  minio:
    restart: unless-stopped
    image: go-recorder-minio:local
    build:
      context: .
      dockerfile: dockers/minio/Dockerfile
    command: server /data --console-address ":9001"
    env_file:
      - .env
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-go_recorder}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-go_recorder_pass}
    ports:
      - "${MINIO_PORT_HOST:-9000}:9000"
      - "${MINIO_CONSOLE_PORT_HOST:-9001}:9001"
    volumes:
      - ./dockers/minio/data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9000/minio/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
  gateway_network:
    external: true
    name: ${GATEWAY_NETWORK:-gateway_default}
