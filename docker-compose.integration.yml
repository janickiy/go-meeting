# Только изолированные проверки; фиксированные credentials не предназначены для production.
# docker compose -p recorder-stage6 -f docker-compose.integration.yml up -d --build
x-app: &app
  APP_ENV: test
  GIN_MODE: release
  JWT_SECRET: stage6-test-only-jwt-000000000000000000
  MEDIA_TICKET_SECRET: stage6-test-only-ticket-00000000000000
  MEDIA_INTERNAL_SECRET: stage6-test-only-media-000000000000000
  WORKER_INTERNAL_SECRET: stage6-test-only-worker-00000000000000
  METRICS_SECRET: stage6-test-only-metrics-0000000000000
  POSTGRES_HOST: postgres
  POSTGRES_DB: recorder_stage6
  POSTGRES_USER: recorder_stage6
  POSTGRES_PASSWORD: stage6-test-only-password
  REDIS_HOST: redis
  RABBIT_MQ_HOST: rabbitmq
  RABBIT_MQ_USER: recorder_stage6
  RABBIT_MQ_PASSWORD: stage6-test-only-password
  MINIO_ENDPOINT: minio:9000
  MINIO_ROOT_USER: recorder_stage6
  MINIO_ROOT_PASSWORD: stage6-test-only-password
  MINIO_PUBLIC_ENDPOINT: https://localhost:15482
  MINIO_BUCKET: recordings
  MEDIA_WORKER_INTERNAL_URL: http://media-worker:8091
  WORKER_INTERNAL_URL: http://worker:8090
  TURN_URLS: turn:coturn:3478?transport=udp,turn:coturn:3478?transport=tcp
  TURN_SHARED_SECRET: stage6-test-only-turn-0000000000000000
  TURN_FORCE_RELAY: "false"

services:
  frontend:
    profiles: [browser]
    build: {context: ./frontend, dockerfile: Dockerfile}
    environment: {API_UPSTREAM: "api:8085"}
    ports: ["127.0.0.1:15173:8080"]
  https:
    profiles: [browser]
    image: nginx:1.30.5-alpine
    ports: ["127.0.0.1:15482:443"]
    volumes: ["./dockers/https/nginx.conf:/etc/nginx/conf.d/default.conf:ro", "./dockers/https/certs:/etc/nginx/certs:ro"]
    depends_on: [api,frontend]
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: recorder_stage6
      POSTGRES_USER: recorder_stage6
      POSTGRES_PASSWORD: stage6-test-only-password
    ports: ["127.0.0.1:15433:5432"]
    volumes: ["postgres:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U recorder_stage6 -d recorder_stage6"]
      interval: 2s
      timeout: 2s
      retries: 30
  redis:
    image: redis:7-alpine
    ports: ["127.0.0.1:16380:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30
  rabbitmq:
    image: rabbitmq:4.2.9-management
    environment:
      RABBITMQ_DEFAULT_USER: recorder_stage6
      RABBITMQ_DEFAULT_PASS: stage6-test-only-password
    ports: ["127.0.0.1:15682:5672", "127.0.0.1:15683:15672"]
    volumes: ["rabbitmq:/var/lib/rabbitmq"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
  minio:
    image: go-recorder-minio:local
    environment:
      MINIO_ROOT_USER: recorder_stage6
      MINIO_ROOT_PASSWORD: stage6-test-only-password
    command: server /data --console-address :9001
    ports: ["127.0.0.1:19000:9000"]
    volumes: ["minio:/data"]
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 2s
      retries: 30
  coturn:
    image: coturn/coturn:4.18.0-r0
    entrypoint: turnserver
    # Loopback допустим только в этом закрытом тестовом стенде, не в prod-конфиге.
    command: ["-n", "--no-tls", "--fingerprint", "--use-auth-secret", "--static-auth-secret=stage6-test-only-turn-0000000000000000", "--realm=stage6.local", "--listening-port=3478", "--min-port=50100", "--max-port=50140", "--allow-loopback-peers", "--no-multicast-peers", "--log-file=stdout"]
  media-worker:
    build: {context: ., dockerfile: dockers/media-worker/Dockerfile, target: runtime}
    environment:
      <<: *app
      MEDIA_HTTP_PORT: "8091"
      MEDIA_WORKER_ID: stage6-media
      MEDIA_UDP_PORT: "50020"
      MEDIA_TCP_PORT: "50020"
      MEDIA_NAT_IPS: "127.0.0.1"
    ports: ["127.0.0.1:18091:8091", "127.0.0.1:50020:50020/udp", "127.0.0.1:50020:50020/tcp"]
    depends_on:
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8091/health/ready"]
      interval: 2s
      timeout: 2s
      retries: 30
    stop_grace_period: 45s
  worker:
    build: {context: ., dockerfile: dockers/worker/Dockerfile, target: runtime}
    environment:
      <<: *app
      WORKER_PORT: "8090"
      WORKER_ID: stage6-recorder
      STORAGE_PATH: /storage
      WEBRTC_UDP_PORT: "0"
      WEBRTC_TCP_PORT: "0"
    volumes: ["storage:/storage"]
    ports: ["127.0.0.1:18090:8090"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      minio: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8090/health/ready"]
      interval: 2s
      timeout: 2s
      retries: 30
    stop_grace_period: 45s
  api:
    build: {context: ., dockerfile: dockers/api/Dockerfile, target: runtime}
    environment:
      <<: *app
      APP_PORT: "8085"
    ports: ["127.0.0.1:18085:8085"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      rabbitmq: {condition: service_healthy}
      minio: {condition: service_healthy}
      media-worker: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8085/health/ready"]
      interval: 2s
      timeout: 2s
      retries: 30
    stop_grace_period: 45s
volumes:
  postgres:
  rabbitmq:
  minio:
  storage:
