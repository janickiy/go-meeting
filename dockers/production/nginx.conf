map $http_upgrade $connection_upgrade { default upgrade; '' close; }
log_format safe '$remote_addr $request_method $uri $status';
server {
    listen 443 ssl;
    server_name _;
    ssl_certificate /run/certs/fullchain.pem;
    ssl_certificate_key /run/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    client_max_body_size 1m;
    client_body_timeout 30s;
    access_log /var/log/nginx/access.log safe;
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $api_upstream api:8085;
    set $frontend_upstream frontend:8080;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    # Эксплуатационные и внутренние endpoints доступны только в сети Compose.
    location ~ ^/(metrics|health|internal|operations|debug)(/|$) { return 404; }
    location = /version {
        proxy_pass http://$api_upstream;
        proxy_set_header Host $http_host;
        expires -1;
    }
    # Страницы записей отделены от вложенных подписанных путей S3 bucket.
    location = /recordings {
        proxy_pass http://$frontend_upstream;
        proxy_set_header Host $http_host;
    }
    location = /recordings/ {
        proxy_pass http://$frontend_upstream;
        proxy_set_header Host $http_host;
    }
    location ~ "^/recordings/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/?$" {
        proxy_pass http://$frontend_upstream;
        proxy_set_header Host $http_host;
    }
    location /recordings/ {
        proxy_pass http://minio:9000;
        proxy_method GET;
        proxy_set_header Host $http_host;
        proxy_buffering off;
    }
    location ~ ^/api/v1/(conferences|conversations)/[^/]+/attachments/[^/]+/content$ {
        client_max_body_size 11m;
        proxy_request_buffering off;
        proxy_pass http://$api_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 90s;
    }
    location ~ ^/api/v1/(conferences/[^/]+/ws|ws)$ {
        error_log /dev/null crit;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
    location = /api/v1/notifications/events {
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 40s;
    }
    location /api/ {
        proxy_pass http://$api_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 60s;
    }
    # Код и состояние OAuth находятся в строке запроса: даже ошибки вышестоящего сервера не должны их журналировать.
    location ~ ^/app/settings/calendar/[^/]+/callback$ {
        error_log /dev/null crit;
        proxy_pass http://$frontend_upstream;
        proxy_set_header Host $http_host;
    }
    location / {
        proxy_pass http://$frontend_upstream;
        proxy_set_header Host $http_host;
    }
}
