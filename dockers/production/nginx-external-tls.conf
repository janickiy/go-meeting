map $http_upgrade $connection_upgrade { default upgrade; '' close; }
log_format safe '$remote_addr $request_method $uri $status';
server {
    # Порт контейнера публикуется исключительно на 127.0.0.1 хоста.
    listen 8080;
    server_name _;
    server_tokens off;
    client_max_body_size 1m;
    client_body_timeout 30s;
    access_log /var/log/nginx/access.log safe;
    # Apache перезаписывает X-Forwarded-For. Доверяем только gateway отдельной сети.
    set_real_ip_from 172.31.242.1;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $api_upstream api:8085;
    set $frontend_upstream frontend:8080;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    include /etc/nginx/snippets/recorder-routes.conf;
}
