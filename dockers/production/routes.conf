# Общие маршруты для прямого TLS и TLS на существующем веб-сервере хоста.
location ~ ^/(metrics|health|internal|operations|debug)(/|$) { return 404; }
location = /version {
    proxy_pass http://$api_upstream;
    proxy_set_header Host $http_host;
    expires -1;
}
# Страницы записей отделены от вложенных подписанных путей S3 bucket.
location = /recordings {
    proxy_pass http://$frontend_upstream;
    proxy_set_header Host $http_host;
}
location = /recordings/ {
    proxy_pass http://$frontend_upstream;
    proxy_set_header Host $http_host;
}
location ~ "^/recordings/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/?$" {
    proxy_pass http://$frontend_upstream;
    proxy_set_header Host $http_host;
}
location /recordings/ {
    # Публично разрешено только подписанное чтение, не запись и не S3 admin API.
    limit_except GET { deny all; }
    proxy_pass http://minio:9000;
    proxy_set_header Host $http_host;
    proxy_buffering off;
}
location ~ ^/api/v1/(conferences|conversations)/[^/]+/attachments/[^/]+/content$ {
    client_max_body_size 11m;
    proxy_request_buffering off;
    proxy_pass http://$api_upstream;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 90s;
}
location ~ ^/api/v1/(conferences/[^/]+/ws|ws)$ {
    # Строка запроса содержит ticket; исключаем её из журнала ошибок.
    error_log /dev/null crit;
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 120s;
    proxy_buffering off;
}
location = /api/v1/notifications/events {
    proxy_pass http://$api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header Connection "";
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_buffering off;
    proxy_read_timeout 40s;
}
location /api/ {
    proxy_pass http://$api_upstream;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_read_timeout 60s;
}
# OAuth query-параметры не должны попадать в журнал ошибок.
location ~ ^/app/settings/calendar/[^/]+/callback$ {
    error_log /dev/null crit;
    proxy_pass http://$frontend_upstream;
    proxy_set_header Host $http_host;
}
location / {
    proxy_pass http://$frontend_upstream;
    proxy_set_header Host $http_host;
}
