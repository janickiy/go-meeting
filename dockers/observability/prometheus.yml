global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files: [/etc/prometheus/alerts.yml]
scrape_configs:
  - job_name: recorder
    authorization:
      type: Bearer
      credentials_file: /run/secrets/metrics_token
    static_configs:
      - targets: ["api:8085"]
        labels: {service: api}
      - targets: ["media-worker:8091"]
        labels: {service: media-worker}
      - targets: ["worker:8090"]
        labels: {service: recorder-worker}
      - targets: ["product-worker:8092"]
        labels: {service: product-worker}
