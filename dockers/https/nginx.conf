server {
    listen 443 ssl;
    server_name 192.168.90.201 localhost;

    ssl_certificate /etc/nginx/certs/go-recorder-server.crt;
    ssl_certificate_key /etc/nginx/certs/go-recorder-server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 50m;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $frontend_upstream frontend:8080;
    set $api_upstream api:8085;

    location /recordings/ {
        proxy_pass http://minio:9000;
        proxy_method GET;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://$frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Preserve all API and legacy recorder/debug routes on the same HTTPS origin.
    location ~ ^/(api/|debug/|health$) {
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
