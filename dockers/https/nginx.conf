log_format safe_realtime '$remote_addr $request_method $uri $status';
server {
    listen 443 ssl;
    server_name 192.168.90.201 localhost;

    ssl_certificate /etc/nginx/certs/go-recorder-server.crt;
    ssl_certificate_key /etc/nginx/certs/go-recorder-server.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    client_max_body_size 50m;
    access_log /var/log/nginx/access.log safe_realtime;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $frontend_upstream frontend:8080;
    set $api_upstream api:8085;
    add_header Referrer-Policy no-referrer always;

    # Параметры OAuth не попадают в журнал доступа ($uri) и отключённый журнал ошибок вышестоящего сервера.
    location ~ ^/app/settings/calendar/[^/]+/callback$ {
        error_log /dev/null crit;
        proxy_pass http://$frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
    }

    # SPA списка и UUID записи не должны попадать в маршрут одноимённого S3 bucket.
    # Подписанные файлы имеют вложенный путь: /recordings/<ключ с каталогами>.
    location = /recordings {
        proxy_pass http://$frontend_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location = /recordings/ {
        proxy_pass http://$frontend_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location ~ "^/recordings/[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}/?$" {
        proxy_pass http://$frontend_upstream;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Proto https;
    }
    location /recordings/ {
        proxy_pass http://minio:9000;
        proxy_method GET;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://$frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Все маршруты API и прежние маршруты записи и отладки используют общий источник HTTPS.
    location ~ ^/api/v1/conferences/[^/]+/attachments/[^/]+/content$ {
        client_max_body_size 11m;
        client_body_timeout 60s;
        proxy_request_buffering off;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 90s;
    }
    location = /api/v1/notifications/events {
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_read_timeout 40s;
    }
    location ~ ^/api/v1/conferences/[^/]+/ws$ {
        error_log /dev/null crit;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
    location ~ ^/(api/|debug/|health$) {
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 120s;
    }
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}
